[tools]
1password-cli = "latest"
amp = { version = "0.0.1789660852-g000545", allow_builds = ["@ampcode/cli"] }
atuin = "latest"
bat = "latest"
bun = "latest"
claude-code = "latest"
codex = "latest"
delta = "latest"
dotenv-linter = "latest"
eza = "latest"
fastfetch = "latest"
fd = "latest"
flyctl = "latest"
fzf = "latest"
gh = "latest"
glow = "latest"
go = "latest"
jj = "latest"
jq = "latest"
just = "latest"
lazydocker = "latest"
lazygit = "latest"
lua = "latest"
neovim = "latest"
node = "lts"
"npm:neovim" = "latest"
opencode = "latest"
pi = "latest"
"pipx:llm" = { version = "latest", with = ["llm-gemini", "llm-deepseek", "llm-templates-github", "llm-docs", "llm-anthropic", "llm-uv-tool", "llm-templates-fabric"] }
"pipx:posting" = "latest"
"pipx:tldr" = "latest"
"pipx:wakatime" = "latest"
pnpm = "latest"
rclone = "latest"
ripgrep = "latest"
rustic = "latest"
starship = "latest"
tmux = "latest"
topgrade = "latest"
usage = "latest"
uv = "latest"
yazi = "latest"
zoxide = "latest"

[env]
_.layouts = { tools = true }

[plugins]
layouts = "~/.config/mise/plugins/layouts"

[bootstrap.packages]
# Select managers in untracked config.local.toml on each machine.
"brew:fish" = "latest"
"brew-cask:ghostty" = { version = "latest", os = "macos", adopt = true }
"pacman:fish" = "latest"
"pacman:ghostty" = "latest"

"brew:btop" = "latest"
"brew:ffmpeg" = "latest"
"brew:wget" = "latest"
"brew:gnupg" = "latest"
"brew:llvm" = "latest"
"brew:pkgconf" = "latest"
"brew:readline" = "latest"
"pacman:btop" = "latest"
"pacman:ffmpeg" = "latest"
"pacman:git" = "latest"
"pacman:curl" = "latest"
"pacman:wget" = "latest"
"pacman:less" = "latest"
"pacman:zip" = "latest"
"pacman:unzip" = "latest"
"pacman:gnupg" = "latest"
"pacman:whois" = "latest"
"pacman:plocate" = "latest"
"pacman:inetutils" = "latest"
"pacman:llvm" = "latest"
"pacman:base-devel" = "latest"
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:wget" = "latest"
"apt:less" = "latest"
"apt:zip" = "latest"
"apt:unzip" = "latest"
"apt:gnupg" = "latest"
"apt:whois" = "latest"
"apt:plocate" = "latest"
"apt:inetutils-tools" = "latest"
"apt:build-essential" = "latest"
"apt:pkg-config" = "latest"
"apt:libreadline-dev" = "latest"
"brew-cask:wezterm" = { version = "latest", os = "macos", adopt = true }
"pacman:wezterm" = "latest"

[bootstrap.mise_shell_activate]
fish = "activate"
zshrc = "activate"

[bootstrap.services.mise-history]
builtin = "history-watch"

[history]
exclude = [
  "~/.config/fish/fish_variables",
  "~/.config/fish/**/*.local.fish",
  "~/.config/mise/plugins/layouts/**/__pycache__/**",
  "~/.config/mise/plugins/layouts/**/*.pyc",
  "~/.config/fish/completions/{docker,kubectl,orbctl}.fish",
]

[dotfiles]
"~/.config/jj/config.toml" = { mode = "track" }
"~/.local/bin/git-sclone" = { mode = "track" }
"~/.local/bin/git-rebase-feature-branch" = { mode = "track" }
"~/.local/bin/video2gif" = { mode = "track" }
"~/.tmux.conf" = { mode = "track" }
"~/.config/wezterm" = { mode = "track" }
"~/.config/lazydocker/config.yml" = { mode = "track" }
"~/.config/posting/config.yaml" = { mode = "track" }
"~/.config/glow/glow.yml" = { mode = "track" }
"~/.config/btop/btop.conf" = { mode = "track" }
"~/.config/eza/theme.yml" = { mode = "track" }
"~/.config/bat/themes" = { mode = "track" }
"~/.config/bat/config" = { mode = "track" }
"~/.config/atuin/config.toml" = { mode = "track" }
"~/.config/fish" = { mode = "track" }
"~/.config/ghostty" = { mode = "track" }
"~/.config/mise/config.toml" = { mode = "track" }
"~/.config/mise/fonts/monolisa" = { mode = "track" }
"~/.config/mise/plugins/layouts" = { mode = "track" }
"~/.config/starship.toml" = { mode = "track" }
"~/.hushlogin" = { mode = "track", variants = [{ os = "macos" }] }

[tasks.bootstrap]
description = "Configure shell utilities, Rust, and agent history hooks"
run = [
  'test -x "$HOME/.cargo/bin/rustup" || curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile default --component rust-analyzer',
  'bat cache --build',
  'mise run bootstrap:nvim',
  "atuin hook install codex",
  "atuin hook install claude-code",
  "atuin hook install opencode",
  "atuin hook install pi",
]

[dotfiles."fonts/monolisa/MonoLisaNormal.ttf"]
source = "~/.config/mise/fonts/monolisa/MonoLisaNormal.ttf"
mode = "copy"
variants = [
  { os = "macos", target = "~/Library/Fonts/MonoLisaNormal.ttf" },
  { os = "linux", target = "~/.local/share/fonts/monolisa/MonoLisaNormal.ttf" },
]

[dotfiles."fonts/monolisa/MonoLisaItalic.ttf"]
source = "~/.config/mise/fonts/monolisa/MonoLisaItalic.ttf"
mode = "copy"
variants = [
  { os = "macos", target = "~/Library/Fonts/MonoLisaItalic.ttf" },
  { os = "linux", target = "~/.local/share/fonts/monolisa/MonoLisaItalic.ttf" },
]

[settings.npm]
shell_out = true

[bootstrap.repos]
"~/.config/nvim" = { url = "https://github.com/joshuadavidthomas/nvim" }
"~/.tmux/plugins/tpm" = { url = "https://github.com/tmux-plugins/tpm.git" }
"~/.tmux/plugins/tmux-resurrect" = { url = "https://github.com/tmux-plugins/tmux-resurrect.git" }

[tasks."bootstrap:nvim"]
description = "Restore Neovim providers and install missing plugins"
run = [
  'uv sync --project "$HOME/.config/nvim" --locked --python 3.13',
  'nvim --headless "+Lazy! install" +qa',
  "nvim --headless \"+lua require('lazy').load({plugins={'nvim-treesitter'}}); local p=require('lazy.core.config').plugins['nvim-treesitter']; local opts=require('lazy.core.plugin').values(p,'opts',false); require('nvim-treesitter.install').ensure_installed_sync(opts.ensure_installed)\" +qa",
  'nvim --headless +UpdateRemotePlugins +qa',
]

[bootstrap.macos.launchd.agents.amp-runner]
program = "~/.local/bin/mise"
args = ["exec", "--", "amp", "--no-tui", "--runner-id", "{{ vars.amp_runner_id }}", "--discover-dirs"]
working_directory = "~/Code"
run_at_load = true
keep_alive = true
throttle_interval = 30
stdout_path = "~/Library/Logs/amp-runner.log"
stderr_path = "~/Library/Logs/amp-runner.err.log"
environment = { PATH = "{{ env.HOME }}/.local/bin:{{ env.HOME }}/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin", MISE_LAYOUTS_DISABLE = "1" }
